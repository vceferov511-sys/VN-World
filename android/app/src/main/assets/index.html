<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101a38">
<title>V.N World</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:22px 17px 35px;min-height:100vh;
 color:white;font-family:Arial,sans-serif;
 background:radial-gradient(circle at top,#304b91,#101a38 55%,#070b18);
}
header{text-align:center;padding:30px 0}
.cloud{
 width:145px;height:75px;margin:30px auto 20px;
 position:relative;display:flex;align-items:center;
 justify-content:center;border-radius:50px;
 background:linear-gradient(135deg,#54d5ff,#6269ff,#a66bff);
 box-shadow:0 0 40px #657aff88;
}
.cloud:before,.cloud:after{
 content:"";position:absolute;background:inherit;border-radius:50%;
}
.cloud:before{width:65px;height:65px;top:-25px;left:23px}
.cloud:after{width:75px;height:75px;top:-35px;right:18px}
.logo{position:relative;z-index:2;font-size:32px;font-weight:900}
.world{letter-spacing:7px;color:#b8d9ff;font-size:12px}
h1{letter-spacing:4px;font-size:27px;margin:18px 0 5px}
.tagline{color:#9eb8e8;font-size:13px}
.card{
 padding:21px;margin:16px 0;border-radius:20px;
 background:linear-gradient(145deg,#26395dcc,#111d38ee);
 border:1px solid #718bd455;
 box-shadow:0 12px 30px #0004;
}
p{color:#b4c5e3;line-height:1.6}
#aiMessages{
 min-height:65px;max-height:280px;overflow:auto;
 background:#0a142b;border-radius:13px;padding:12px;
}
input{
 width:100%;padding:15px;margin:13px 0;
 background:#263957;color:white;border:1px solid #49638d;
 border-radius:12px;font-size:15px;
}
button{
 width:100%;padding:15px;border:0;border-radius:12px;
 color:white;font-weight:bold;font-size:15px;
 background:linear-gradient(100deg,#397ff5,#8259f5);
}
.footer{text-align:center;color:#7186ad;font-size:12px;margin-top:30px}
</style>
</head>
<body>
<header>
 <div class="cloud"><span class="logo">V.N</span></div>
 <div class="world">WORLD</div>
 <h1>V.N WORLD</h1>
 <div class="tagline">Your world, your possibilities</div>
</header>

<div class="card">
 <h2>Xoş gəlmisən! 👋</h2>
 <p>V.N World – öz dünyan, öz imkanların. Hər şey bir yerdə!</p>
</div>

<div class="card">
 <h3>🤖 V.N AI</h3>
 <div id="aiMessages">Salam! Mən V.N AI. Sənə necə kömək edə bilərəm?</div>
 <input id="aiInput" placeholder="Mesajını yaz...">
 <button onclick="sendAI()">Göndər ➤</button>
</div>

<div class="footer">© 2026 V.N World · Sənin dünyan</div>

<script>
async function sendAI(){
 const input=document.getElementById('aiInput');
 const messages=document.getElementById('aiMessages');
 const value=input.value.trim();
 if(!value)return;

 const user=document.createElement('p');
 const label=document.createElement('b');
 label.textContent='Sən: ';
 user.append(label,document.createTextNode(value));
 messages.appendChild(user);
 input.value='';

 try{
  const response=await fetch('http://127.0.0.1:3000/chat',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({message:value})
  });
  const data=await response.json();
  const reply=document.createElement('p');
  const name=document.createElement('b');
  name.textContent='V.N AI: ';
  reply.append(name,document.createTextNode(data.reply||data.error||'Cavab alınmadı'));
  messages.appendChild(reply);
 }catch(error){
  const err=document.createElement('p');
  err.textContent='Serverlə əlaqə qurulmadı.';
  messages.appendChild(err);
 }
 messages.scrollTop=messages.scrollHeight;
}
</script>
<img src="vnworld_cover.jpg" style="width:100%;height:100vh;object-fit:cover;position:fixed;inset:0;z-index:9999;" /></body>
</html>
